org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
# Reuse task outputs and configuration between local builds.
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
# Bound concurrent work on memory-constrained development machines.
org.gradle.workers.max=2
kotlin.daemon.jvmargs=-Xmx1g

android.useAndroidX=true
android.nonTransitiveRClass=true
# Pin AGP 9.4's strongest supported R8 modes; debug does not run R8.
android.enableR8.fullMode=true
android.r8.strictFullModeForKeepRules=true
android.r8.optimizedResourceShrinking=true
kotlin.code.style=official
