name: Release

# Publishes a GitHub release when versionName in app/build.gradle.kts gets a value
# that has no v<versionName> tag yet.
on:
  push:
    branches: [main]
    paths: [app/build.gradle.kts]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Release new version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Read version
        id: version
        run: |
          name=$(sed -nE 's/^\s*versionName\s*=\s*"([^"]+)".*/\1/p' app/build.gradle.kts)
          code=$(sed -nE 's/^\s*versionCode\s*=\s*([0-9]+).*/\1/p' app/build.gradle.kts)
          if [ -z "$name" ] || [ -z "$code" ]; then
            echo "::error::versionName or versionCode not found in app/build.gradle.kts"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "tag=v$name" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$name" > /dev/null; then
            echo "Tag v$name already exists, nothing to release."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v5
        if: steps.version.outputs.new == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        if: steps.version.outputs.new == 'true'

      - uses: gradle/actions/setup-gradle@v4
        if: steps.version.outputs.new == 'true'
        with:
          cache-read-only: true

      - name: Restore signing keystore
        if: steps.version.outputs.new == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ZFL_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ZFL_KEYSTORE_BASE64 is not set; releases must be signed with the project key."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "ZFL_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Test and build release APK
        if: steps.version.outputs.new == 'true'
        env:
          ZFL_KEYSTORE_PASSWORD: ${{ secrets.ZFL_KEYSTORE_PASSWORD }}
          ZFL_KEY_ALIAS: ${{ secrets.ZFL_KEY_ALIAS }}
          ZFL_KEY_PASSWORD: ${{ secrets.ZFL_KEY_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease --stacktrace

      - name: Prepare assets
        if: steps.version.outputs.new == 'true'
        run: |
          mkdir dist
          apk="ZFL-Launcher-${{ steps.version.outputs.name }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/$apk"
          cd dist
          sha256sum "$apk" > "$apk.sha256"
          cat "$apk.sha256"

      - name: Create release
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          NAME: ${{ steps.version.outputs.name }}
          CODE: ${{ steps.version.outputs.code }}
        run: |
          apk="ZFL-Launcher-$NAME.apk"
          {
            echo "**ZFL Launcher $NAME** (versionCode $CODE)"
            echo
            echo "SHA-256:"
            echo '```'
            cat "dist/$apk.sha256"
            echo '```'
          } > notes.md
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "ZFL Launcher $NAME" \
            --notes-file notes.md \
            --generate-notes

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
